name: Test and Coverage CI

on:
  push:
    branches: [ main, feat/**, fix/**, test/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.10"]

    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.git
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=venv,.git

      - name: Run Test Suite with Pytest & Coverage
        run: |
          python -m pytest --cov=src --cov=engine --cov=database --cov=chunker --cov-report=xml --cov-report=term-missing tests/ -v

      - name: Verify Architecture & Legacy Test Suite
        run: |
          python -m unittest test_api.py

      - name: Verify Multi-Domain Benchmark Runner
        run: |
          python -c "from src.benchmarks.runner import DomainBenchmarkRunner; r = DomainBenchmarkRunner().run_benchmark(); print('Domain Benchmark Accuracy:', r['overall_accuracy_pct'], '%'); assert r['status'] == 'success'"
